name: checks
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17.11
                env:
                    POSTGRES_USER: projects
                    POSTGRES_PASSWORD: projects
                    POSTGRES_DB: projects
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U projects -d projects"
                    --health-interval 5s --health-timeout 5s --health-retries 12
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: python -m pip install uv==0.12.16
            - run: uv sync --locked
            - run: uv run projects migrate
            - run: uv run ruff check src tests migrations scripts deploy
            - run: uv run ruff format --check src tests migrations scripts deploy
            - run: uv run mypy src/projects
            - run: uv run pytest
    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: web/package-lock.json
            - run: npm ci
            - run: npm run check
            - run: npm run build
