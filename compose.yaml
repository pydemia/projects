services:
    db:
        image: postgres:17.11
        environment:
            POSTGRES_USER: projects
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projects}
            POSTGRES_DB: projects
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - projects_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U projects -d projects"]
            interval: 5s
            timeout: 5s
            retries: 12
volumes:
    projects_pgdata:
