<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docs=[
 {id:'REQ',group:'기획',name:'요구사항 정의서',version:'0.3',status:'확정',body:'## 현재 범위\n필수 요구사항 4건을 첫 릴리즈의 기준으로 관리한다.\n## 수용 조건\n- 프로젝트와 산출물을 연결한다.\n- 변경 이력과 검증 근거를 남긴다.'},
 {id:'PLAN',group:'기획',name:'기능 기획서',version:'0.3',status:'검토 중',body:'## 프로젝트 목적\n아이디어부터 설계·구현·검증까지 진행 과정과 산출물을 한 프로젝트에서 관리한다.\n## 사용자와 사용 맥락\n개인이 메모에서 프로젝트를 시작하고 소규모 팀이 문서와 근거를 이어받는다.\n## 첫 릴리즈 범위\n- 프로젝트와 요구사항 작성\n- 문서 버전과 연결 관계 관리\n- 작업·테스트 결과 기록\n## 미정 사항\n운영 배포 방식과 AI 공급자를 확정해야 한다.'},
 {id:'UI',group:'기획',name:'UI 기획서',version:'0.2',status:'초안',body:'## 화면 구성\n프로젝트 탐색과 문서·목록을 기본으로 두고 관련 근거를 함께 보여 준다.\n## 주요 화면\n- 프로젝트 개요\n- 문서 작성과 검토\n- 구현 작업·테스트\n- 요구사항별 추적\n## 예외 상태\n빈 결과·저장 실패·충돌·권한 없음과 모바일 배치를 정의한다.'},
 {id:'SYS',group:'설계',name:'시스템 아키텍처',version:'0.1',status:'확정',body:'## 시스템 경계\n웹 클라이언트, API, 관계형 저장소, 파일 저장소, 비동기 작업자로 구성한다.\n## 데이터 흐름\n사용자 변경을 revision과 관계로 기록한다. AI는 선택한 근거로 제안을 생성하고 사용자가 채택한다.\n## 결정\n초기 API는 모듈을 나눈 단일 애플리케이션으로 구성한다.'},
 {id:'INF',group:'설계',name:'인프라 설계서',version:'0.1',status:'미작성',body:'## 환경\n개발·테스트·운영 환경의 경계를 작성한다.\n## 배포와 복구\n배포 방식, 비밀값, 백업·복구 검증 방법을 구체화한다.\n## 미정 사항\n배포 공급자·운영 예산·복구 목표 미정.'},
 {id:'APP',group:'설계',name:'애플리케이션 설계서',version:'0.2',status:'확정',body:'## 모듈과 책임\n프로젝트·요구사항, 문서·검토, 작업·테스트, 추적·변경의 책임을 구분한다.\n## 문서 버전\n확정 revision은 보존한다. 편집과 복원은 새 초안을 만든다.\n## 변경 영향\n연결한 근거 revision과 현재 기준선을 비교한다.\n## 검토할 사항\n요구사항의 새 기준에 따른 영향 판정 규칙을 검토한다.'},
 {id:'IF',group:'설계',name:'인터페이스 설계서',version:'0.1',status:'검토 중',body:'## API 계약\n프로젝트 범위 REST API와 구조화된 오류를 사용한다.\n## 충돌\n기대 revision이 다르면 409를 반환하고 입력을 보존한다.\n## 외부 연동\n첫 버전은 PR·commit·실행 결과 링크를 수동 등록한다.'},
 {id:'IMPL',group:'구현',name:'구현 계획서',version:'0.2',status:'초안',body:'## 구현 순서\n- 프로젝트·요구사항·문서 저장\n- 작업·테스트·추적 관계\n- 기준선·변경 영향·완료 점검\n- AI 문서·계획 보조\n## 완료 기준\n대상 revision과 검증 결과를 함께 기록한다.'},

function ideaProposal(){const blocked=ideaRelation==='충돌·보류',duplicate=ideaRelation==='중복 연결';return `<div style="padding:13px 0;border-bottom:1px solid var(--line)"><span class="mono muted">요건 후보 · 원안 IDEA-022</span><h3 style="font-size:16px;margin-top:9px">버전 비교와 선택 내용 복원</h3><p class="small muted">${duplicate?'기존 REQ-002 연결만 제안합니다. 새 요건·작업을 생성하지 않습니다.':blocked?'충돌하는 요건과 적용 조건을 확인한 뒤 반영 방식을 결정합니다. 현재는 보류합니다.':'두 버전의 차이를 보고 선택한 내용만 새 초안에 반영한다. 확정본과 선택하지 않은 본문은 보존한다.'}</p><span class="small">${ideaRelation==='신규 기능'?'새 기능 후보 · 기존 기능과 연관 관계':'FEAT-02 ↔ REQ-002 · 기존 기준과 관계 보존'}</span></div><h3 style="margin-top:22px">${duplicate?'연결 결과':blocked?'남은 결정':'구현 반영 묶음'}</h3>${duplicate?'<p class="small muted">원안 → 기존 기능·요건 연결, 중복 사유 기록</p>':blocked?'<p class="small muted">기존 전체 복원과 새 부분 복원의 적용 조건·기본값을 확인해야 합니다.</p>':`<div class="ref">요건 초안 <span class="muted">· 새 수용 조건·출처</span></div><div class="ref">UI·Application 설계 수정 <span class="muted">· 비교·복원 규칙</span></div><div class="ref">구현 작업 <span class="muted">· TASK-205 비교·부분 복원</span></div><div class="ref">회귀 테스트 후보 <span class="muted">· 확정본 불변·선택·취소</span></div>`}<p class="hint">반영은 계획 초안 생성입니다. 실제 코드 변경과 테스트 실행은 별도 근거로 확인합니다.</p><button class="primary" data-action="apply-idea" ${(ideaApplied||blocked)?'disabled':''}>${ideaApplied?'시안의 계획 초안에 반영됨':duplicate?'기존 요건에 연결':'변경 묶음을 계획 초안에 반영'}</button>`;}

function markdown(s){return s.split('\n').map(l=>l.startsWith('## ')?`<h3>${esc(l.slice(3))}</h3>`:l.startsWith('- ')?`<p style="padding-left:12px">• ${esc(l.slice(2))}</p>`:l?`<p>${esc(l)}</p>`:'').join('');}
function documents(){const d=docs.find(x=>x.id===selectedDoc);return header('산출물','작성한 문서와 그 근거를 함께 확인합니다.',`<span class="badge blue">간편 → 표준 확장 예시</span>`)+`<div class="document-layout"><aside class="doclist" aria-label="산출물 목록"><label for="doc-search" class="sr-only">문서 검색</label><input id="doc-search" class="search" placeholder="문서 검색" value="${esc(docSearch)}"><div id="doc-list" class="doc-list-items">${docList()}</div></aside><section class="document-main"><div class="doc-heading"><h2>${esc(d.name)}</h2><div class="actions"><button data-action="portable">독립 작업</button><button class="primary" data-action="ai">스킬로 수정</button>${editing?'':`<button data-action="edit">${d.status==='확정'?'새 초안 직접 편집':'직접 편집'}</button>`}</div></div><div class="doc-meta">${badge(d.status)}<span>v${esc(d.version)}</span><span>· 소유자</span><span>· 저장 위치: 시안 메모리</span></div>${d.id==='APP'&&changed&&!impactReviewed?'<div class="notice">REQ-003 v2가 현재 기준으로 지정되었습니다. 이 문서의 변경 영향을 검토해 주세요.</div>':''}<div class="doc-split"><article class="doc-body">${editing?`<label for="editor" class="sr-only">문서 초안 본문</label><textarea id="editor" class="editor">${esc(draft)}</textarea><div class="editor-actions"><button class="primary" data-action="save">시안에 저장</button><button data-action="cancel-edit">편집 취소</button><span class="muted small">서버 저장 기능은 시연 범위 밖입니다.</span></div>`:markdown(d.body)}</article><aside class="doc-aside"><section><div class="eyebrow">연결한 요구사항</div><div class="ref"><span class="mono">REQ-002</span>산출물 버전 관리</div><div class="ref"><span class="mono">REQ-003</span>요구 변경 영향 확인</div><button class="linkbtn small" data-view="trace" style="margin-top:12px">연결표에서 보기 →</button></section><section><div class="eyebrow">관련 작업·검증</div><div class="ref"><span class="mono">TASK-202</span>문서 revision과 복원</div><div class="ref"><span class="mono">TC-002</span>확정본 복원 테스트</div><button class="linkbtn small" data-view="tests" style="margin-top:12px">테스트 결과 보기 →</button></section><section><div class="eyebrow">검토할 질문</div><p>배포 환경과 AI 공급자를 언제 확정할까요?</p><p>스킬 제안은 선택한 항목만 초안에 반영합니다.</p></section></aside></div></section></div>`;}
function docList(){let group='';const found=docs.filter(d=>(d.name+' '+d.id).toLowerCase().includes(docSearch.toLowerCase()));if(!found.length)return '<p class="empty">검색 결과가 없습니다.</p>';return found.map(d=>{let out=group!==d.group?`<div class="doc-group">${d.group}</div>`:'';group=d.group;return out+`<button data-doc="${d.id}" class="doc-item ${selectedDoc===d.id?'active':''}" ${selectedDoc===d.id?'aria-current="true"':''}>${esc(d.name)}<small>v${d.version} · ${d.status}</small></button>`;}).join('');}
function taskPage(){const filtered=tasks.filter(t=>taskFilter==='전체'||t.status===taskFilter);return header('구현 작업','기준 문서와 완료 조건을 보고 착수합니다.')+`<div class="toolbar"><div class="filterset" role="group" aria-label="작업 상태 필터">${['전체','할 일','진행 중','검토 중','완료'].map(s=>`<button data-task-filter="${s}" class="${taskFilter===s?'selected':''}" aria-pressed="${taskFilter===s}">${s}</button>`).join('')}</div><span class="muted small">${filtered.length}건 · 목록 보기</span></div><div class="tablewrap"><table><thead><tr><th>작업</th><th>상태</th><th>기준 설계</th><th>검증 근거</th><th></th></tr></thead><tbody>${filtered.map(t=>`<tr><td><span class="mono muted">${t.id}</span><br><strong>${t.title}</strong><span class="cell-sub">${t.req} · 소유자</span></td><td>${badge(t.status)}</td><td><button class="linkbtn" data-doc="${t.doc}">${docs.find(d=>d.id===t.doc).name}</button></td><td>${t.evidence}<span class="cell-sub">${changed&&t.req==='REQ-003'?'현재 기준 변경 · 재검토 필요':'B-01 기준'}</span></td><td><button class="small" data-task="${t.id}">완료 기준</button></td></tr>`).join('')}</tbody></table></div><p class="hint">완료 조건과 검증 근거가 충족된 작업만 완료로 처리합니다. PR 링크만으로 검증을 통과시키지 않습니다.</p>`;}
function testPage(){return header('테스트','케이스와 실행 기록을 구분하고 대상 버전을 남깁니다.')+`<div class="test-stats"><span><b>${tests.filter(t=>t.status==='통과').length}</b>통과</span><span><b>${tests.filter(t=>t.status==='실패').length}</b>실패</span><span><b>${tests.filter(t=>t.status==='미실행').length}</b>미실행</span><span class="muted">실제 CI 연결 없음</span></div><div class="tablewrap"><table><thead><tr><th>테스트 케이스</th><th>최근 결과</th><th>실행 기준</th><th>기록</th><th></th></tr></thead><tbody>${tests.map(t=>`<tr><td><span class="mono muted">${t.id}</span><br><strong>${t.title}</strong><span class="cell-sub">${t.req} · 케이스 v1</span></td><td>${badge(t.status)}</td><td>${t.basis}<span class="cell-sub">${t.runs?'개발 환경 · 수동 실행 예시':'실행 대상 지정 필요'}</span></td><td>${t.runs}회<span class="cell-sub">${t.detail}</span></td><td><button class="small" data-test="${t.id}">결과 기록</button></td></tr>`).join('')}</tbody></table></div><p class="hint">통과 기록이 있어도 다른 기준선·commit에 대한 결과이면 현재 범위의 검증 근거로 사용하지 않습니다.</p>`;}
function tracePage(){const rows=requirements.filter(r=>traceFilter==='전체'||(changed&&r.id==='REQ-003'));return header('추적·변경','요구사항에서 설계·구현·검증 근거를 따라갑니다.',`<button data-action="simulate-change" ${changed?'disabled':''}>${changed?'변경 예시 적용됨':'요구 변경 시연'}</button>`)+`${changed?`<div class="notice">REQ-003 v1 → v2 · 새 기준선 B-02의 재검토 예시입니다. 과거 문서와 테스트 이력은 보존됩니다.${!impactReviewed?' <button class="plain small" data-action="review-impact">영향 검토</button>':' <strong>영향 있음으로 검토 · 후속 조치 필요</strong>'}</div>`:''}<div class="toolbar"><div class="filterset" role="group" aria-label="추적 상태 필터">${['전체','재검토'].map(s=>`<button data-trace-filter="${s}" class="${traceFilter===s?'selected':''}" aria-pressed="${traceFilter===s}">${s}</button>`).join('')}</div><span class="muted small">${rows.length}건 · 관계와 근거 revision</span></div><div class="tablewrap"><table class="trace-table"><thead><tr><th>요구사항</th><th>설계</th><th>구현</th><th>검증</th><th>현재 판정</th></tr></thead><tbody>${rows.map((r,i)=>{const t=tasks.find(x=>x.req===r.id),test=tests.find(x=>x.req===r.id),impact=changed&&r.id==='REQ-003';return `<tr><td><span class="mono muted">${r.id} · ${impact?'v2':'v1'}</span><br><strong>${r.title}</strong></td><td><button class="linkbtn" data-doc="${r.doc}">${docs.find(d=>d.id===r.doc).name}</button><span class="cell-sub">${impact?'기존 요구 v1 기준':'현재 요구 기준'}</span></td><td><button class="linkbtn" data-task="${t.id}">${t.id}</button><span class="cell-sub">${t.status}</span></td><td><button class="linkbtn" data-test="${test.id}">${test.id}</button><span class="cell-sub">${test.status}</span></td><td>${badge(impact?'재검토 필요':test.status==='통과'?'연결됨':test.status==='실패'?'실패':'미검증')}${impact?`<span class="cell-sub">${impactReviewed?'영향 검토 완료 · 조치 대기':'설계·작업·테스트 영향 미검토'}</span>`:''}</td></tr>`;}).join('')}</tbody></table>${!rows.length?'<p class="empty">표시할 항목이 없습니다. 요구 변경 시연으로 영향 후보를 확인할 수 있습니다.</p>':''}</div><p class="hint">연결이 있는 상태와 검증된 상태는 다릅니다. 영향 검토 완료 후에도 설계 보완·작업·테스트 조치가 남을 수 있습니다.</p>`;}
function modal(title,body,footer){const dialog=document.getElementById('dialog');dialog.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button class="plain" aria-label="대화상자 닫기" data-action="close">✕</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div>`;dialog.showModal();}
function openAI(){if(editing)draft=document.getElementById('editor')?.value??draft;const d=docs.find(x=>x.id===selectedDoc);modal('스킬 실행 · 문서 수정',`<p>고정 결과 시연입니다. 실제 모델 호출은 없습니다.</p><p class="mono">document-writing-workflow<br>requirements-verification<br>source revision · 06215a2c0fd7</p><p>요청 → 스킬·근거 읽기 → 문서 변경안 → 검수 → 초안 반영</p><div class="scope-note"><strong class="small">참조 범위</strong><p>${esc(d.name)} v${d.version} · REQ-002 v1 · REQ-003 ${changed?'v2':'v1'}</p></div><label class="proposal"><input type="checkbox" name="proposal" value="확정본은 보존하고 복원할 내용을 새 초안으로 생성한다." checked><span>확정본 복원 규칙 명시<small>근거: REQ-002 · 이력과 현재 초안을 구분</small></span></label><label class="proposal"><input type="checkbox" name="proposal" value="요구 변경 시 연결한 설계·작업·테스트를 영향 후보로 표시한다." checked><span>변경 영향 검토 단계 추가<small>근거: REQ-003 · 영향 없음 판정에도 사유 기록</small></span></label><label class="proposal"><input type="checkbox" name="proposal" value="AI 공급자와 월 예산은 미정이며 도입 전에 결정한다."><span>미정 조건을 질문으로 보존<small>가정·질문 · 자동으로 구현 사실이나 일정으로 확정하지 않음</small></span></label>`,`<button data-action="close">취소</button><button class="primary" data-action="apply-ai">선택 항목을 초안에 반영</button>`);}
function testModal(id){const t=tests.find(x=>x.id===id);modal('테스트 결과 기록',`<p><strong>${t.id}</strong> · ${t.title}</p><p>기존 실행 ${t.runs}회는 보존하고 새 수동 실행 예시를 추가합니다.</p><form id="test-form"><label class="formfield">실행 대상 commit 또는 문서 revision<input name="basis" required placeholder="예: demo-b2" value="demo-b2"></label><label class="formfield">실행 결과<select name="result"><option>통과</option><option>실패</option><option>중단</option></select></label><label class="formfield">실제 결과·근거<textarea name="detail" required placeholder="실제로 확인한 결과와 증빙을 적어 주세요."></textarea></label></form>`,`<button data-action="close">취소</button><button class="primary" data-test-save="${id}">시안에 실행 기록 추가</button>`);}
document.addEventListener('input',e=>{if(e.target.id==='doc-search'){docSearch=e.target.value;document.getElementById('doc-list').innerHTML=docList();}if(e.target.id==='editor')draft=e.target.value;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return;}if(b.dataset.doc){openDoc(b.dataset.doc);return;}if(b.dataset.taskFilter){taskFilter=b.dataset.taskFilter;render();return;}if(b.dataset.traceFilter){traceFilter=b.dataset.traceFilter;render();return;}if(b.dataset.task){const t=tasks.find(x=>x.id===b.dataset.task);modal(t.id+' 완료 기준',`<p><strong>${t.title}</strong></p><p>근거: ${t.req} · ${docs.find(d=>d.id===t.doc).name}</p><ul class="small"><li>요구사항의 수용 조건 충족</li><li>변경 결과와 해당 revision 연결</li><li>현재 기준의 테스트 통과 근거 연결</li></ul><p>현재 결과: ${t.evidence}</p>`,`<button data-action="close">닫기</button>`);return;}if(b.dataset.test){testModal(b.dataset.test);return;}if(b.dataset.testSave){const form=document.getElementById('test-form');if(!form.reportValidity())return;const fd=new FormData(form),t=tests.find(x=>x.id===b.dataset.testSave);t.status=fd.get('result');t.basis=(changed&&t.req==='REQ-003'?'B-02':'B-01')+' / '+fd.get('basis');t.detail=fd.get('detail');t.history.push({status:t.status,basis:t.basis,detail:t.detail});t.runs=t.history.length;document.getElementById('dialog').close();render();toast('새 실행 예시를 추가했습니다. 서버에는 저장되지 않습니다.');return;}const d=docs.find(x=>x.id===selectedDoc);switch(b.dataset.action){case 'close':document.getElementById('dialog').close();break;case 'edit':draft=d.body;editing=true;render();document.getElementById('editor').focus();break;case 'cancel-edit':draftCache.delete(selectedDoc);editing=false;draft='';render();break;case 'save':d.body=document.getElementById('editor').value;d.version=(Number(d.version)+.1).toFixed(1);d.status='초안';draftCache.delete(selectedDoc);editing=false;draft='';render();toast('시안 메모리에 저장했습니다. 새로고침하면 초기화됩니다.');break;case 'ai':openAI();break;case 'apply-ai':{const selected=[...document.querySelectorAll('[name=proposal]:checked')].map(i=>i.value);if(!selected.length){toast('반영할 제안을 선택해 주세요.');break;}draft=(editing?draft:d.body)+'\n## 채택한 제안\n'+selected.map(s=>'- '+s).join('\n');editing=true;document.getElementById('dialog').close();render();toast('편집 초안에 반영했습니다. 저장 전에는 문서에 적용되지 않습니다.');break;}case 'idea':modal('아이디어 메모',`<p>프로젝트 원안에서 목표·가정·질문으로 구체화하는 입력 예시입니다.</p><label class="formfield">메모<textarea id="idea-input">프로젝트 기획·설계·구현·테스트 과정과 산출물을 연결해서 관리하고 싶다.</textarea></label><p>개인 사용 → 소규모 팀 확장 · AI 문서·계획 보조</p>`,`<button data-action="close">취소</button><button class="primary" data-action="save-idea">메모 보관 시연</button>`);break;case 'save-idea':document.getElementById('dialog').close();toast('메모 보관 동작 예시입니다. 실제 프로젝트 데이터는 생성하지 않습니다.');break;case 'simulate-change':changed=true;impactReviewed=false;render();toast('REQ-003 v2 기준의 변경 영향 예시를 표시했습니다.');break;case 'review-impact':modal('변경 영향 검토',`<p>REQ-003 v2 → 애플리케이션 설계 → TASK-203 → TC-003</p><p>설계·작업·테스트의 후속 조치가 필요하다고 판정하는 예시입니다. 이 판정만으로 재검토 필요 상태나 미실행 테스트가 해소되지 않습니다.</p>`,`<button data-action="close">취소</button><button class="primary" data-action="confirm-impact">영향 있음으로 기록</button>`);break;case 'confirm-impact':impactReviewed=true;document.getElementById('dialog').close();render();toast('영향 검토를 기록했습니다. 조치는 아직 완료되지 않았습니다.');break;}});
document.addEventListener('input',e=>{if(e.target.id==='idea-text')ideaText=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='idea-relation'){ideaRelation=e.target.value;document.getElementById('idea-proposal').innerHTML=ideaProposal();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;switch(b.dataset.action){case 'analyze-idea':ideaText=document.getElementById('idea-text').value;if(!ideaText.trim()){toast('아이디어 메모를 작성해 주세요.');return;}ideaAnalyzed=true;render();break;case 'apply-idea':if(ideaApplied||ideaRelation==='충돌·보류')return;ideaApplied=true;render();toast(ideaRelation==='중복 연결'?'원안을 기존 요건에 연결했습니다. 새 작업은 생성하지 않았습니다.':'계획 초안에 요건·설계·작업·회귀 테스트 후보를 연결했습니다.');break;case 'portable':{const d=docs.find(x=>x.id===selectedDoc);modal('같은 스킬로 문서 하나를 별도 작업',`<p>선택 문서: <strong>${esc(d.name)} v${d.version}</strong></p><p>앱 밖 LLM에서도 동일한 스킬 bundle·참조·입력 문서를 사용합니다. 모델과 도구가 다르면 결과 문구까지 같다고 보장하지 않습니다.</p><div class="scope-note"><h3>실행 묶음 구성</h3><p>request.md · 원문 문서·입력 hash<br>skills.lock.json · bundle 원문/참조<br>변경·출처·검수 sidecar</p></div><p><a href="https://skills.pydemia.ai/skills/document-writing-workflow" target="_blank" rel="noopener">Hub에서 원문 스킬 보기</a></p><p>시안에는 실제 bundle 반출과 외부 파일 재연결 기능이 없습니다. 제품에서 hash/diff·충돌 처리와 함께 구현할 계약입니다.</p>`,`<button data-action="close">닫기</button>`);break;}}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(label[next]){view=next;render();}});
if(label[location.hash.slice(1)])view=location.hash.slice(1);render();
</script>
</body>
