[project]
name = "projects-app"
version = "0.1.0"
description = "Skill-driven project documents and delivery workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0,<7",
]

[project.scripts]
projects = "projects.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/projects"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

